<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ateliê Barbara Dias</title>

    <meta name="description"
          content="Amigurumis e artesanato feitos à mão com carinho.">

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

    <header class="cabecalho">

        <div class="logo">

            <img
                src="imagens/logo.png"
                alt="Ateliê Barbara Dias">

            <h1>Ateliê Barbara Dias</h1>

            <p>
                Peças artesanais produzidas com carinho.
            </p>

        </div>

    </header>
<nav class="menu">

    <a href="https://wa.me/5511982747585?text=Olá! Gostaria de mais informações sobre os produtos do Ateliê Barbara Dias." target="_blank">
        Contato
    </a>

    <button id="btnCarrinho">
        🛒 Carrinho
        <span id="contadorCarrinho">0</span>
    </button>

</nav>
    <main>

        <section class="pesquisa">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔍 Pesquise um produto...">

        </section>

        <section class="filtros">

            <select id="categoria">

                <option value="">Todas as categorias</option>

            </select>

            <select id="ordenacao">

                <option value="nome">Nome (A-Z)</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>

            </select>

        </section>

        <section
            id="lista-produtos"
            class="lista-produtos">

        </section>

    </main>

    <aside
        id="carrinho"
        class="carrinho">

    </aside>

    <footer>

        © 2026 Ateliê Barbara Dias

    </footer>

    <script type="module" src="scripts/app.js?v=2"></script>

</body>

</html>
